<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Bio Link Anggi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1d2671, #c33764);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
}

        .card {
            background: rgba(0,0,0,0.3);
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 350px;
            text-align: center;
        }

        img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        h1 {
            margin: 10px 0 5px;
            font-size: 24px;
        }

        p {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        a {
            display: block;
            text-decoration: none;
            background: white;
            color: black;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-weight: bold;
            transition: 0.2s;
        }

        a:hover {
            background: #ffd6e8;
        }
        
        * {
    -webkit-touch-callout: none; /* iOS */
    -webkit-user-select: none;   /* Safari */
    -moz-user-select: none;      /* Firefox */
    -ms-user-select: none;       /* IE/Edge */
    user-select: none;           /* Standard */
}

html, body {
    touch-action: manipulation;
}
    </style>
</head>
<body>

    <div class="card">
        <img src="https://via.placeholder.com/300" alt="Foto Profil">

        <h1>ANGGI MIRANDI</h1>
        <p>No bio yet</p>

        <a href="https://discordapp.com/users/656346915310534697" target="_blank">Discord</a>
        <a href="https://instagram.com/anggi.mirandi" target="_blank">Instagram</a>
        <a href="https://whatsapp.com/channel/0029VabZOJNId7nIKuEbaP23" target="_blank">WhatsApp Channel</a>
        <a href="https://youtube.com/anggimirandi?sub_confirmation=1" target="_blank">YouTube Channel</a>
    </div>

<script>
  // Matikan klik kanan (desktop)
  document.addEventListener('contextmenu', function (e) {
    e.preventDefault();
  });

  // Matikan long-press (mobile)
  document.addEventListener('touchstart', function (e) {
    if (e.touches.length > 1) {
      e.preventDefault();
    }
  }, { passive: false });

  document.addEventListener('gesturestart', function (e) {
    e.preventDefault();
  });
</script>

<script>
  // Matikan Ctrl + click & Ctrl + scroll (zoom / tab baru)
  document.addEventListener('wheel', function (e) {
    if (e.ctrlKey) {
      e.preventDefault();
    }
  }, { passive: false });

  document.addEventListener('click', function (e) {
    if (e.ctrlKey) {
      e.preventDefault();
    }
  });
</script></body>
</html>
